<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Md. Shariful Islam Rony — Backend-Focused Full-Stack Developer">
  <defs>
    <linearGradient id="accentLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1a7f37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d0d7de" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridLight" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eaeef2" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="858" height="198" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Subtle Right Architectural Grid -->
  <rect x="590" y="16" width="250" height="168" rx="8" fill="url(#gridLight)" opacity="0.95"/>
  <g fill="none" stroke="#d0d7de" stroke-width="1">
    <path d="M626 56 H738 V100 H806"/>
    <path d="M626 144 H710 V100"/>
    <path d="M738 144 H806"/>
  </g>
  <g>
    <circle cx="626" cy="56" r="4" fill="#0969da"/>
    <circle cx="738" cy="100" r="4.5" fill="#1a7f37"/>
    <circle cx="806" cy="100" r="4" fill="#0969da"/>
    <circle cx="626" cy="144" r="3.5" fill="#6e7781"/>
    <circle cx="806" cy="144" r="3.5" fill="#6e7781"/>
  </g>
  <rect x="614" y="28" width="204" height="144" rx="6" fill="none" stroke="#eaeef2" stroke-width="1"/>

  <!-- Top Accent Rule -->
  <rect x="36" y="26" width="180" height="2" rx="1" fill="url(#accentLineLight)"/>

  <!-- Eyebrow -->
  <circle cx="41" cy="48" r="3.5" fill="#1a7f37"/>
  <text x="54" y="52" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2">BACKEND-FOCUSED FULL-STACK DEVELOPER</text>

  <!-- Main Name -->
  <text x="36" y="92" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.4">Md. Shariful Islam Rony</text>

  <!-- Positioning Subtitle -->
  <text x="36" y="120" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Building database-driven web systems, REST APIs &amp; AI-powered applications</text>

  <!-- Bottom Focus Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">
    <rect x="36" y="142" width="128" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="100" y="159" fill="#1f2328" text-anchor="middle">Python &amp; Django</text>

    <rect x="174" y="142" width="106" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="227" y="159" fill="#1f2328" text-anchor="middle">PostgreSQL</text>

    <rect x="290" y="142" width="142" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="361" y="159" fill="#1f2328" text-anchor="middle">React &amp; Tailwind</text>

    <rect x="442" y="142" width="132" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="508" y="159" fill="#0969da" text-anchor="middle">Conversational AI</text>
  </g>
</svg>
